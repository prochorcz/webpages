<style>
/* Layout: dark CID hero band with logo + title, then a filter bar and an equal-height grid of person tiles */
:root{
  --bg:#f4f7fa; --card:#ffffff; --line:#e3e9ef; --fg:#626567; --head:#1a1a1a; --muted:#8d96a3;
  --red:#FF525F; --red-soft:#ffe7e9; --red-ink:#c7303d;
  --blue:#A9C5DF; --blue-soft:#e6eff7; --blue-ink:#3d6488;
  --grey-soft:#eceff3; --grey-ink:#4f5660;
  --hero:#1a1a1a; --hero-fg:#ffffff; --hero-sub:#A9C5DF;
  --pop:#1a1a1a; --pop-fg:#f2f4f6;
  --font:'Poppins',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111314; --card:#1b1e21; --line:#2a2f34; --fg:#c3c9d0; --head:#ffffff; --muted:#8a939e;
  --red-soft:#3a1f22; --red-ink:#ff8a93; --blue-soft:#1f2b37; --blue-ink:#a9c5df;
  --grey-soft:#262a2f; --grey-ink:#c3c9d0; --hero:#0b0c0d; --pop:#f2f4f6; --pop-fg:#1a1a1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111314; --card:#1b1e21; --line:#2a2f34; --fg:#c3c9d0; --head:#ffffff; --muted:#8a939e;
  --red-soft:#3a1f22; --red-ink:#ff8a93; --blue-soft:#1f2b37; --blue-ink:#a9c5df;
  --grey-soft:#262a2f; --grey-ink:#c3c9d0; --hero:#0b0c0d; --pop:#f2f4f6; --pop-fg:#1a1a1a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.hero{background:var(--hero);color:var(--hero-fg)}
.hero .wrap{padding-block:28px 40px;display:flex;flex-direction:column;gap:22px}
.hero img{height:38px;width:auto;align-self:flex-start}
.hero h1{margin:0;font-weight:600;font-size:clamp(28px,4.4vw,44px);line-height:1.12;text-wrap:balance;letter-spacing:-.01em}
.hero h1 span{color:var(--red)}
.hero p{margin:10px 0 0;color:var(--hero-sub);font-size:clamp(15px,1.8vw,18px);max-width:60ch}
.hero .rule{width:56px;height:3px;background:var(--red);border-radius:2px}

.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding-block:22px 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 13px/1 var(--font);padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.chip:hover{border-color:var(--blue)}
.chip[aria-pressed="true"]{background:var(--head);color:var(--bg);border-color:var(--head)}
.chip b{font-weight:600;opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.search{flex:1 1 220px;max-width:340px}
.search input{width:100%;font:400 14px var(--font);padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--head)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;padding-bottom:48px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;display:grid;grid-template-rows:auto auto 1fr 1fr;gap:14px;height:400px}
.who{display:flex;gap:12px;align-items:center;min-width:0}
.av{flex:0 0 44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;background:var(--blue-soft);color:var(--blue-ink)}
.who>div{min-width:0}
.name{margin:0;font-size:16px;font-weight:600;color:var(--head);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co{font-size:13px;font-weight:500;color:var(--red-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role{font-size:13px;color:var(--head);line-height:1.4;height:2.8em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;border-bottom:1px solid var(--line);padding-bottom:12px;box-sizing:content-box}
.blk{min-width:0;display:flex;flex-direction:column;gap:6px;position:relative}
.lbl{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.txt{font-size:13px;line-height:1.5;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.g .txt{-webkit-line-clamp:4}
.i .txt{-webkit-line-clamp:4}
.stream{align-self:flex-start;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:999px}
.s-dd{background:var(--red-soft);color:var(--red-ink)}
.s-dq{background:var(--blue-soft);color:var(--blue-ink)}
.s-mm{background:var(--grey-soft);color:var(--grey-ink)}
.more{display:none;align-self:flex-start;font:500 12px var(--font);color:var(--red-ink);background:none;border:0;padding:0;cursor:pointer}
.blk.has-more .more{display:inline}
.pop{display:none;position:absolute;left:-8px;right:-8px;bottom:calc(100% - 18px);z-index:5;background:var(--pop);color:var(--pop-fg);border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.5;white-space:pre-line;max-height:300px;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.blk.has-more:hover .pop,.blk.has-more:focus-within .pop,.blk.open .pop{display:block}
.fav{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.fav:hover{background:var(--grey-soft);color:var(--red)}
.fav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}
.fav[aria-pressed="true"]{color:var(--red)}
.fav[aria-pressed="true"] svg{fill:currentColor}
.card.liked{border-color:var(--red)}
.who{padding-right:30px}
.empty{grid-column:1/-1;text-align:center;padding:48px 0;color:var(--muted)}
footer{padding-block:0 32px;color:var(--muted);font-size:12px}
@media (max-width:480px){.card{height:auto;min-height:380px}.search{max-width:none;margin-left:0}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--blue)}}
</style>

const grid=document.getElementById('grid'),q=document.getElementById('q');
const KEY='pjm-meetup-likes';
let likes=new Set();try{likes=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){}
const track=(n,p)=>{try{window.pjmTracking&&pjmTracking.event(n,p)}catch(e){}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...likes]))}catch(e){}};
const id=p=>p.n+'|'+p.f;
const HEART='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg>';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ini=n=>n.split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();
function blk(cls,label,lines){
  const short=lines.join(' · ');
  return `<div class="blk ${cls}"><div class="lbl">${label}</div>`+
   `<div class="txt">${esc(short)}</div>`+
   (lines.length?`<button class="more" type="button">Zobrazit celé</button><div class="pop" role="tooltip">${esc(lines.join('\n'))}</div>`:'')+`</div>`;
}
function render(){
  const term=q.value.trim().toLowerCase();
  const list=P.filter(p=>!term||[p.n,p.f,p.r,...p.g,...p.i].join(' ').toLowerCase().includes(term));
  grid.innerHTML=list.length?list.map(p=>{const on=likes.has(id(p));return `<article class="card${on?' liked':''}">
    <button class="fav" type="button" data-id="${esc(id(p))}" aria-pressed="${on}" aria-label="Chci se potkat: ${esc(p.n)}" title="Chci se potkat">${HEART}</button>
    <div class="who"><div class="av" aria-hidden="true">${ini(p.n)}</div><div><h2 class="name" title="${esc(p.n)}">${esc(p.n)}</h2><div class="co" title="${esc(p.f)}">${esc(p.f)}</div></div></div>
    <div class="role" title="${esc(p.r)}">${esc(p.r)}</div>
    ${blk('g','S čím umí poradit',p.g)}
    ${blk('i','O čem chce mluvit',p.i)}
  </article>`}).join(''):'<div class="empty">Nikoho takového jsme nenašli. Zkuste jiné slovo.</div>';
  grid.querySelectorAll('.blk').forEach(b=>{const t=b.querySelector('.txt');if(t&&t.scrollHeight>t.clientHeight+2)b.classList.add('has-more')});
}
q.addEventListener('input',render);
grid.addEventListener('click',e=>{const h=e.target.closest('.fav');if(h){const k=h.dataset.id,on=!likes.has(k);on?likes.add(k):likes.delete(k);save();track('heart_toggle',{event_category:'engagement',event_label:on?'like':'unlike'});h.setAttribute('aria-pressed',on);h.closest('.card').classList.toggle('liked',on);return}const m=e.target.closest('.more');grid.querySelectorAll('.blk.open').forEach(o=>{if(!m||o!==m.parentElement)o.classList.remove('open')});if(m){m.parentElement.classList.toggle('open');track('detail_view',{event_category:'engagement'})}});
render();
window.addEventListener('resize',()=>{clearTimeout(window._r);window._r=setTimeout(render,150)});
</script>
